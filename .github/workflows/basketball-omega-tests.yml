name: Basketball OMEGA tests
on:
  push:
    paths: ["basketball_omega/**", "tests/test_basketball_omega.py"]
  pull_request:
    paths: ["basketball_omega/**", "tests/test_basketball_omega.py"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_basketball_omega.py' -v
