name: Basketball OMEGA CI Swarm

on:
  push:
    branches: ["feature/basketball-omega-fusion-v1"]
    paths:
      - "basketball_omega/**"
      - "tests/test_basketball_*.py"
      - ".github/workflows/basketball-omega-tests.yml"
  pull_request:
    paths:
      - "basketball_omega/**"
      - "tests/test_basketball_*.py"
      - ".github/workflows/basketball-omega-tests.yml"

permissions:
  contents: read

jobs:
  swarm:
    name: OMEGA CI Swarm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bot: [static, boundary, contracts, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install basketball service dependency
        run: python -m pip install --quiet fastapi
      - name: Run ${{ matrix.bot }} bot
        run: |
          python - <<'PY'
          from basketball_omega.ci_swarm import StaticBot, BoundaryBot, ContractBot, TestBot
          bots = {"static": StaticBot, "boundary": BoundaryBot, "contracts": ContractBot, "tests": TestBot}
          result = bots["${{ matrix.bot }}"]().run()
          print(result)
          if not result.passed:
              raise SystemExit(1)
          PY

  gate:
    name: OMEGA Swarm Gate
    needs: swarm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every bot to pass
        env:
          RESULT: ${{ needs.swarm.result }}
        run: |
          echo "swarm_result=$RESULT"
          test "$RESULT" = "success"

  full-regression:
    name: Basketball full regression
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install basketball service dependency
        run: python -m pip install --quiet fastapi
      - name: Run all basketball tests
        run: python -m unittest discover -s tests -p 'test_basketball_*.py' -v
