name: Basketball OMEGA empirical gates
on:
  pull_request:
    paths:
      - 'basketball_omega/**'
      - 'tests/test_basketball_models_v2.py'
      - 'tests/test_basketball_omega_empirical.py'
  push:
    branches:
      - feature/basketball-omega-fusion-v1
jobs:
  empirical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest fastapi
      - run: pytest -q tests/test_basketball_models_v2.py tests/test_basketball_ingestion.py tests/test_basketball_ingestion_adapters.py
      - run: python -m compileall -q basketball_omega
  promotion-audit:
    runs-on: ubuntu-latest
    needs: empirical-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest fastapi
      - run: pytest -q tests/test_basketball_walk_forward.py tests/test_basketball_historical_pipeline.py
      - run: python -m compileall -q basketball_omega
