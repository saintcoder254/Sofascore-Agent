name: MatchMaster scheduled pipeline

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matchmaster-scheduled-pipeline
  cancel-in-progress: false

jobs:
  poll:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate scheduler configuration
        env:
          BASE_URL: ${{ secrets.MATCHMASTER_BASE_URL }}
          CRON_TOKEN: ${{ secrets.MATCHMASTER_CRON_TOKEN }}
        run: |
          test -n "$BASE_URL" || { echo "::error::Set MATCHMASTER_BASE_URL repository secret"; exit 1; }
          test -n "$CRON_TOKEN" || { echo "::error::Set MATCHMASTER_CRON_TOKEN repository secret"; exit 1; }
      - name: Poll and persist current fixtures
        env:
          BASE_URL: ${{ secrets.MATCHMASTER_BASE_URL }}
          CRON_TOKEN: ${{ secrets.MATCHMASTER_CRON_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 120 \
            -X POST -H "Authorization: Bearer ${CRON_TOKEN}" \
            "${BASE_URL%/}/cron/run/poll"

  continuous:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    needs: poll
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run enrichment, learning, source scoring, and verification
        env:
          BASE_URL: ${{ secrets.MATCHMASTER_BASE_URL }}
          CRON_TOKEN: ${{ secrets.MATCHMASTER_CRON_TOKEN }}
        run: |
          set -euo pipefail
          for stage in enrichment learning sources verify; do
            echo "Running MatchMaster stage: $stage"
            curl --fail --silent --show-error --retry 1 --max-time 240 \
              -X POST -H "Authorization: Bearer ${CRON_TOKEN}" \
              "${BASE_URL%/}/cron/run/${stage}"
            echo
          done

  slow-cycle:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run evolution and research
        env:
          BASE_URL: ${{ secrets.MATCHMASTER_BASE_URL }}
          CRON_TOKEN: ${{ secrets.MATCHMASTER_CRON_TOKEN }}
        run: |
          set -euo pipefail
          for stage in evolution research; do
            echo "Running MatchMaster stage: $stage"
            curl --fail --silent --show-error --retry 1 --max-time 240 \
              -X POST -H "Authorization: Bearer ${CRON_TOKEN}" \
              "${BASE_URL%/}/cron/run/${stage}"
            echo
          done
