name: Deploy Elite MatchMaster to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: elite-matchmaster
  REGION: europe-west1
  AR_REPOSITORY: elite-matchmaster
  IMAGE_NAME: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/elite-matchmaster/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable required Google Cloud APIs
        run: |
          gcloud services enable \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            run.googleapis.com \
            --project "${{ secrets.GCP_PROJECT_ID }}"

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${AR_REPOSITORY}" \
            --location "${REGION}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "${AR_REPOSITORY}" \
            --repository-format=docker \
            --location "${REGION}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --description="Elite MatchMaster container images"

      - name: Build and push container
        run: |
          gcloud builds submit --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE_NAME}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --platform managed \
            --port 8080 \
            --quiet
