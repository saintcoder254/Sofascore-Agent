name: Basketball OMEGA Brute-Force Real Corpus

on:
  workflow_dispatch:
    inputs:
      min_train:
        description: "Minimum chronological training rows"
        required: false
        default: "250"
  push:
    branches:
      - feature/basketball-omega-fusion-v1
    paths:
      - "basketball_omega/**"
      - "scripts/basketball_bruteforce_corpus.py"
      - ".github/workflows/basketball-omega-bruteforce.yml"

jobs:
  real-corpus-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test/runtime dependencies
        run: python -m pip install --upgrade pip pytest fastapi

      - name: Download and verify real historical corpus
        run: |
          python scripts/basketball_bruteforce_corpus.py --min-train ${{ github.event.inputs.min_train || '250' }}
        continue-on-error: true

      - name: Publish immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: basketball-omega-bruteforce-report-${{ github.run_id }}
          path: artifacts/basketball_bruteforce_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce empirical gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/basketball_bruteforce_report.json")
          if not p.exists():
              raise SystemExit("NO_REPORT")
          d=json.loads(p.read_text())
          print(json.dumps(d["promotion"], indent=2))
          if not d["walk_forward"]["chronological"]:
              raise SystemExit("NON_CHRONOLOGICAL_OOS")
          if d["walk_forward"]["oos_rows"] < 250:
              raise SystemExit("LESS_THAN_250_OOS_ROWS")
          if not d["promotion"]["eligible"]:
              raise SystemExit("PROMOTION_GATE_FAILED")
          PY
