services:
  - type: web
    name: elite-matchmaster-sofascore-agent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: matchmaster-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: POLL_SECONDS
        value: "60"
      - key: STALE_AFTER_SECONDS
        value: "180"
      - key: DATABASE_PATH
        value: "/data/matchmaster.db"
      - key: CASE_DATABASE_DIR
        value: "/data/case_databases"
      - key: HTTP_TIMEOUT_SECONDS
        value: "15"
      - key: EVOLUTION_SECONDS
        value: "21600"
      - key: RESEARCH_SECONDS
        value: "21600"
      - key: LEARNING_SECONDS
        value: "300"
      - key: SOURCE_LEARNING_SECONDS
        value: "300"
      - key: VERIFICATION_SECONDS
        value: "300"
      - key: ENRICH_SECONDS
        value: "300"
      - key: ENRICH_MAX_FIXTURES
        value: "2"
      - key: AUTO_ANALYZE
        value: "0"
      - key: AUTO_ANALYZE_MAX
        value: "1"
      - key: MONTE_CARLO_SAMPLES
        value: "10000"
